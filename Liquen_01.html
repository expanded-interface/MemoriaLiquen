<script type="module">
import * as THREE from 'three';
import * as xb from 'xrblocks';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
 * 1. CONFIGURACIÓN EDITABLE
 * ===================================================================== */
// URL directa de los archivos (las URL "blob" de GitHub son páginas HTML).
// Alternativa CDN: 'https://cdn.jsdelivr.net/gh/Almendra-HC/liquen@main/'
const ASSET_BASE = 'https://raw.githubusercontent.com/Almendra-HC/liquen/main/';
const ASSETS = {
  bosque: {label: 'Ambiente del bosque',          source: 'https://github.com/Almendra-HC/liquen/blob/main/audio%20selva%20valdiviana.mp3', file: 'audio%20selva%20valdiviana.mp3'},
  a01:    {label: 'Audio 01: Volvamos al origen', source: 'https://github.com/Almendra-HC/liquen/blob/main/01%20volvamos%20al%20origen.mp3', file: '01%20volvamos%20al%20origen.mp3'},
  a02:    {label: 'Audio 02: Algo pequeño guarda',source: 'https://github.com/Almendra-HC/liquen/blob/main/02%20algo%20pequenio%20guarda.mp3', file: '02%20algo%20pequenio%20guarda.mp3'},
  a03:    {label: 'Audio 03: Azúcar x agua',      source: 'https://github.com/Almendra-HC/liquen/blob/main/03%20azucar%20x%20agua.mp3', file: '03%20azucar%20x%20agua.mp3'},
  a04:    {label: 'Audio 04: Piedra tierra',      source: 'https://github.com/Almendra-HC/liquen/blob/main/04%20piedra%20tierra.mp3', file: '04%20piedra%20tierra.mp3'},
  a05:    {label: 'Audio 05: Sopla fuerte',       source: 'https://github.com/Almendra-HC/liquen/blob/main/05%20sopla%20foeerte.mp3', file: '05%20sopla%20foeerte.mp3'},
  a06:    {label: 'Audio 06: Fuiste comienzo',    source: 'https://github.com/Almendra-HC/liquen/blob/main/06%20fuiste%20comienzo.mp3', file: '06%20fuiste%20comienzo.mp3'},
  a07:    {label: 'Audio 07: Tejido y red',       source: 'https://github.com/Almendra-HC/liquen/blob/main/07%20tejido%20y%20red.mp3', file: '07%20tejido%20y%20red.mp3'},
  cielo:  {label: 'Cielo de liquen',              source: 'https://github.com/Almendra-HC/liquen/blob/main/cielodeliquen.png', file: 'cielodeliquen.png'},
};
const assetUrl = (key) => ASSET_BASE + ASSETS[key].file;

// Música abstracta sintética (referencia: soundtrack de Spore). No se proporcionó URL.
// Si se asigna una URL directa (mp3/ogg con CORS), reemplaza el colchón sintético procedural.
const SPORE_MUSIC_URL = null;

// Duraciones (s). Total automático: 30 + 30 + 25 + 50 + 38 (30 red + 8 regreso) = 173 s.
const SCENES = [
  {id: 'bosque',    label: '01',  dur: 30},
  {id: 'encuentro', label: '02',  dur: 30},
  {id: 'intimidad', label: '02B', dur: 25},
  {id: 'roca',      label: '03',  dur: 50},
  {id: 'red',       label: '04',  dur: 38},
];

const MIX = {forest: 0.8, synth: 0.32};
const NEON = {green: 0x39ff88, pink: 0xff4fd8, yellow: 0xf4ff5a, cyan: 0x4fe3ff, turquoise: 0x2de2c8};
const TEXT = {
  title: 'Memoria Líquen',
  description:
    'Un hongo y un alga eligieron vivir juntos.\n' +
    'Desciende hasta su intimidad y sigue su huella en el bosque valdiviano.\n' +
    'Toda vida es una red.',
  start: 'Comienza tu viaje',
  hint: 'Usa el mando para explorar la estructura celular.',
  timeStart: '400 millones de años',
  timeEnd: 'presente',
};

/* =====================================================================
 * 2. UTILIDADES
 * ===================================================================== */
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const smooth = (t, a, b) => { const x = ramp(t, a, b); return x * x * (3 - 2 * x); };
const lerp = THREE.MathUtils.lerp;
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
const V3 = THREE.Vector3;
const _v = new V3(), _v2 = new V3(), _q = new THREE.Quaternion(), _m = new THREE.Matrix4(), _s = new V3();
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const log = (...a) => console.warn('[LIQUEN]', ...a);
function noPointer(o) { o.xb = {...(o.xb || {}), pointerEvents: 'none'}; return o; }

/* =====================================================================
 * 3. SHADERS (partículas, filamentos, células, red)
 * ===================================================================== */
const DOT_FS = `
uniform vec3 uColor; uniform vec3 uColor2;
varying float vA; varying float vMix;
void main(){ vec2 c = gl_PointCoord - 0.5; float d = dot(c,c); if (d > 0.25) discard;
  float a = 1.0 - d*4.0; a *= a; gl_FragColor = vec4(mix(uColor, uColor2, vMix) * a * vA, 1.0); }`;

const LICHEN_VS = `
uniform float uTime; uniform float uSize; uniform float uIntensity;
attribute float aSeed; varying float vA; varying float vMix;
void main(){
  vA = (0.5 + 0.5*sin(uTime*(0.8 + aSeed*2.2) + aSeed*43.0)) * uIntensity;
  vMix = fract(aSeed*7.13);
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_PointSize = clamp(uSize*(0.5 + aSeed)*900.0 / max(0.05, -mv.z), 1.0, 40.0);
  gl_Position = projectionMatrix * mv; }`;

const SPORE_VS = `
uniform float uTime; uniform float uSize; uniform float uSpread; uniform float uAppear;
attribute float aSeed; attribute float aSpeed; attribute vec3 aDir;
varying float vA; varying float vMix;
void main(){
  float s = uSpread * aSpeed;
  vec3 p = position + aDir * (s * 13.0);
  p += vec3(sin(uTime*0.6 + aSeed*9.0), 0.6*sin(uTime*0.9 + aSeed*5.0), cos(uTime*0.5 + aSeed*7.0)) * (0.03 + 0.5*s);
  vA = uAppear * (0.6 + 0.4*sin(uTime*2.0 + aSeed*30.0)) * (1.0 - smoothstep(0.85, 1.0, s));
  vMix = aSeed;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = clamp(uSize*(0.6 + aSeed*0.8)*900.0 / max(0.05, -mv.z), 1.0, 32.0);
  gl_Position = projectionMatrix * mv; }`;

const HYPHAE_VS = `
uniform float uTime; uniform float uGrow; uniform float uFade;
attribute float aDist; varying float vA; varying float vP;
void main(){
  vA = clamp((uGrow - aDist)*60.0, 0.0, 1.0) * uFade;
  float ph = fract(aDist*6.0 - uTime*0.35);
  vP = pow(max(0.0, 1.0 - abs(ph - 0.5)*10.0), 2.0);
  vec3 p = position + 0.006*sin(uTime*0.8 + position.yzx*9.0);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`;
const HYPHAE_FS = `
uniform vec3 uColor; uniform vec3 uPulse; varying float vA; varying float vP;
void main(){ gl_FragColor = vec4(mix(uColor*0.55, uPulse*1.6, vP) * vA, 1.0); }`;

const CELL_VS = `
uniform float uTime; attribute float aPhase;
varying vec3 vN; varying vec3 vV; varying float vP;
void main(){
  vP = 0.5 + 0.5*sin(uTime*1.6 + aPhase*6.2832);
  vec4 mv = modelViewMatrix * instanceMatrix * vec4(position*(1.0 + 0.05*vP), 1.0);
  vN = normalize(normalMatrix * mat3(instanceMatrix) * normal);
  vV = normalize(-mv.xyz);
  gl_Position = projectionMatrix * mv; }`;
const CELL_FS = `
uniform vec3 uColor; uniform vec3 uCore; uniform float uFade; uniform float uGlow;
varying vec3 vN; varying vec3 vV; varying float vP;
void main(){ float f = 1.0 - abs(dot(normalize(vN), normalize(vV))); f *= f;
  vec3 c = uColor*(0.10 + 1.3*f) + uCore*(0.08 + 0.25*vP)*uGlow;
  gl_FragColor = vec4(c*uFade, 1.0); }`;

const NET_VS = `
uniform float uTime; uniform float uReveal; uniform float uFade; uniform float uWaveR;
attribute float aT; attribute float aSeed; attribute float aOrder;
varying float vA; varying float vP; varying float vSeed;
void main(){
  float r = clamp((uReveal*1.3 - aOrder)*3.0, 0.0, 1.0);
  vA = (aT <= r ? 1.0 : 0.0) * uFade;
  float ph = fract(aT - uTime*(0.18 + aSeed*0.3) + aSeed*5.0);
  vP = pow(max(0.0, 1.0 - abs(ph - 0.5)*9.0), 2.0);
  vec3 p = position;
  p.y += sin(uTime*0.7 + aSeed*30.0) * 0.05 * (1.0 - abs(aT*2.0 - 1.0));
  vP += 0.7 * exp(-pow(length(p.xz) - uWaveR, 2.0) * 1.5);
  vSeed = aSeed;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`;
const NET_FS = `
uniform vec3 uC0; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3;
varying float vA; varying float vP; varying float vSeed;
void main(){ vec3 c = vSeed < 0.25 ? uC0 : (vSeed < 0.5 ? uC1 : (vSeed < 0.75 ? uC2 : uC3));
  gl_FragColor = vec4(c * (0.18 + 1.4*vP) * vA, 1.0); }`;

const NETDOT_VS = `
uniform float uTime; uniform float uSize; uniform float uFade; uniform float uReveal;
attribute vec3 aA; attribute vec3 aC; attribute vec3 aB; attribute float aSeed; attribute float aOrder;
varying float vA; varying float vMix;
void main(){
  float t = fract(uTime*(0.08 + aSeed*0.12) + aSeed*13.0);
  vec3 p = mix(mix(aA, aC, t), mix(aC, aB, t), t);
  float r = clamp((uReveal*1.3 - aOrder)*3.0, 0.0, 1.0);
  vA = uFade * step(0.999, r) * (0.5 + 0.5*sin(t*3.14159));
  vMix = aSeed;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  gl_PointSize = clamp(uSize*900.0 / max(0.05, -mv.z), 1.0, 24.0);
  gl_Position = projectionMatrix * mv; }`;

function additive(vs, fs, uniforms) {
  return new THREE.ShaderMaterial({vertexShader: vs, fragmentShader: fs, uniforms,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending});
}

/* =====================================================================
 * 4. AUDIO CENTRALIZADO (ambiente en streaming, pistas narrativas, sintetizador)
 * ===================================================================== */
const CHORDS = [ // colchón: acordes suaves (Hz)
  [130.81, 196.0, 329.63], [110.0, 164.81, 277.18], [146.83, 220.0, 349.23], [123.47, 185.0, 293.66],
];
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66];
const INSTR = { // timbres ligeros inspirados en kalimba, steel drum y tubular bells
  kalimba: {dur: 0.9, attack: 0.004, partials: [[1, 1], [5.4, 0.12]]},
  steel:   {dur: 1.3, attack: 0.006, partials: [[1, 1], [2, 0.45], [3.01, 0.2]]},
  bell:    {dur: 3.2, attack: 0.004, partials: [[1, 1], [2.76, 0.35], [5.4, 0.15]]},
};

class AudioBus {
  constructor() { this.buffers = {}; this.current = null; this.currentKey = null; this.lastStart = {}; this.ready = false; this.bedStarted = false; this.chordT = 0; this.sparkT = 2; this.chord = 0; }

  setup(listener) {
    const ctx = (this.ctx = listener.context);
    const gain = (v, to) => { const g = ctx.createGain(); g.gain.value = v; g.connect(to); return g; };
    this.master = gain(1, listener.getInput());
    this.forestGain = gain(0, this.master);
    this.synthGain = gain(0, this.master);
    this.narrGain = gain(1, this.master);
    this.sfxGain = gain(0.55, this.master);
    // Ambiente: <audio> en streaming (no se decodifican 212 s en memoria).
    this.forestEl = this.mediaLoop(assetUrl('bosque'), this.forestGain, 'bosque');
    if (SPORE_MUSIC_URL) this.musicEl = this.mediaLoop(SPORE_MUSIC_URL, this.synthGain, 'SPORE_MUSIC_URL');
    for (const k of ['a01', 'a02', 'a03', 'a04', 'a05', 'a06', 'a07']) this.load(k);
    this.ready = true;
  }

  mediaLoop(url, out, label) {
    const el = new Audio();
    el.crossOrigin = 'anonymous'; el.loop = true; el.preload = 'auto'; el.src = url;
    el.addEventListener('error', () => log('no se pudo cargar', label, url));
    try { this.ctx.createMediaElementSource(el).connect(out); } catch (e) { log('audio no enrutable', label, e); }
    return el;
  }

  async load(k) {
    try {
      const res = await fetch(assetUrl(k));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      this.buffers[k] = await this.ctx.decodeAudioData(await res.arrayBuffer());
    } catch (e) { log('pista no disponible:', ASSETS[k].label, e.message || e); }
  }

  unlock() { // llamado desde un gesto del usuario (clic o gatillo)
    if (!this.ready) return;
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
    for (const el of [this.forestEl, this.musicEl]) if (el && el.paused) el.play().catch((e) => log('reproducción bloqueada', e.message));
    this.startBed();
  }

  ramp(param, v, sec) {
    const now = this.ctx.currentTime;
    param.cancelScheduledValues(now); param.setValueAtTime(param.value, now);
    param.linearRampToValueAtTime(v, now + Math.min(5, Math.max(0.05, sec))); // crossfade máx. 5 s
  }
  mix({forest, synth}, sec) {
    if (!this.ready) return;
    if (forest !== undefined) this.ramp(this.forestGain.gain, forest, sec);
    if (synth !== undefined) { this.ramp(this.synthGain.gain, synth, sec); this.synthTarget = synth; }
  }

  playNarr(k) {
    if (!this.ready) return;
    const now = this.ctx.currentTime;
    if (this.currentKey === k && now - (this.lastStart[k] ?? -9) < 1.5) return; // evita copias duplicadas
    this.stopNarr(0.25);
    const buf = this.buffers[k];
    if (!buf) { log('se omite', ASSETS[k].label, '(no cargada)'); return; }
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain(); src.connect(g); g.connect(this.narrGain);
    src.start();
    const entry = {src, g};
    src.onended = () => { if (this.current === entry) { this.current = null; this.currentKey = null; } };
    this.current = entry; this.currentKey = k; this.lastStart[k] = now;
  }
  stopNarr(sec = 0.3) {
    if (!this.current) return;
    const {src, g} = this.current; const now = this.ctx.currentTime;
    g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.linearRampToValueAtTime(0, now + sec);
    try { src.stop(now + sec + 0.02); } catch (e) { /* ya detenida */ }
    this.current = null; this.currentKey = null;
  }

  tone(freq, instr = 'kalimba', vol = 0.18, pan = 0, when = 0) {
    if (!this.ready || this.ctx.state !== 'running') return;
    const ctx = this.ctx, I = INSTR[instr], t0 = ctx.currentTime + when;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + I.attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + I.dur);
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(this.sfxGain); }
    else g.connect(this.sfxGain);
    for (const [mult, amp] of I.partials) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq * mult;
      const pg = ctx.createGain(); pg.gain.value = amp; o.connect(pg); pg.connect(g);
      o.start(t0); o.stop(t0 + I.dur + 0.05);
    }
  }
  arpeggio(freqs, instr, vol, step = 0.09, pan = 0) { freqs.forEach((f, i) => this.tone(f, instr, vol, pan, i * step)); }

  startBed() { // colchón sintético procedural mínimo (6 osciladores + filtro)
    if (this.bedStarted || SPORE_MUSIC_URL) return;
    this.bedStarted = true;
    const ctx = this.ctx;
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 900; filter.Q.value = 0.7;
    const pad = ctx.createGain(); pad.gain.value = 0.35; filter.connect(pad); pad.connect(this.synthGain);
    this.voices = CHORDS[0].map((f) => {
      const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f; o2.detune.value = 7;
      const g = ctx.createGain(); g.gain.value = 0.3; o1.connect(g); o2.connect(g); g.connect(filter);
      o1.start(); o2.start(); return [o1, o2];
    });
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lg = ctx.createGain(); lg.gain.value = 380; lfo.connect(lg); lg.connect(filter.frequency); lfo.start();
  }
  tickBed(dt) {
    if (!this.bedStarted || !(this.synthTarget > 0)) return;
    this.chordT += dt; this.sparkT -= dt;
    if (this.chordT > 9) {
      this.chordT = 0; this.chord = (this.chord + 1) % CHORDS.length;
      const now = this.ctx.currentTime;
      this.voices.forEach(([o1, o2], i) => { o1.frequency.setTargetAtTime(CHORDS[this.chord][i], now, 0.8); o2.frequency.setTargetAtTime(CHORDS[this.chord][i], now, 0.8); });
    }
    if (this.sparkT <= 0) {
      this.sparkT = 1.6 + Math.random() * 1.8;
      const f = PENTA[(Math.random() * PENTA.length) | 0];
      this.tone(f, Math.random() < 0.7 ? 'kalimba' : 'bell', 0.05, Math.random() * 1.6 - 0.8);
    }
  }
}

/* =====================================================================
 * 5. CONSTRUCTORES DE ENTORNO (geometría procedural ligera)
 * ===================================================================== */
const HERO_TRUNKS = [ // troncos cercanos con liquen (x, z, radio)
  [-1.6, -2.4, 0.26], [1.9, -2.6, 0.3], [-2.8, 0.5, 0.28], [2.7, 1.1, 0.27], [0.3, 3.0, 0.3],
];
const ROCK_POS = new V3(0, 0.3, -1.9);

function buildForest(r) {
  const trees = [];
  for (const [x, z, rad] of HERO_TRUNKS) trees.push({x, z, rad, h: 13 + r() * 3, kind: 'hero'});
  let guard = 0;
  while (trees.length < 70 && guard++ < 2000) {
    const a = r() * Math.PI * 2, d = 3.2 + Math.pow(r(), 0.7) * 16;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (Math.hypot(x - ROCK_POS.x, z - ROCK_POS.z) < 1.6) continue;

    if (t.kind === 'alerce' && t.dist < 10) nodes.push(new V3(t.x, t.h * 0.55, t.z));
  });
  for (const p of extra) nodes.push(p.clone());
  for (let i = 0; i < 18; i++) { const a = r() * 6.28, d = 1.5 + r() * 8; nodes.push(new V3(Math.cos(a) * d, 0.03, Math.sin(a) * d)); }
  const edges = new Set(), list = [];
  nodes.forEach((a, i) => {
    const near = nodes.map((b, j) => [j, a.distanceTo(b)]).filter(([j]) => j !== i).sort((x, y) => x[1] - y[1]);
    const picks = near.slice(0, 3).map(([j]) => j);
    if (r() < 0.3) picks.push(near[Math.min(near.length - 1, 4 + Math.floor(r() * 8))][0]);
    for (const j of picks) { const k = i < j ? `${i}-${j}` : `${j}-${i}`; if (!edges.has(k)) { edges.add(k); list.push([i, j]); } }
  });
  const SEG = 12, pos = [], aT = [], aSeed = [], aOrder = [];
  const ctrls = [];
  const maxR = 14;
  list.forEach(([i, j]) => {
    const A = nodes[i], B = nodes[j], len = A.distanceTo(B), sd = r();
    const C = A.clone().add(B).multiplyScalar(0.5).add(new V3((r() - 0.5) * 0.4 * len, 0.25 + len * 0.18, (r() - 0.5) * 0.4 * len));
    const order = clamp01(Math.hypot(C.x, C.z) / maxR) * 0.85 + r() * 0.1;
    ctrls.push([A, C, B, sd, order]);
    for (let k = 0; k < SEG; k++) for (const t of [k / SEG, (k + 1) / SEG]) {
      const u = 1 - t;
      pos.push(u * u * A.x + 2 * u * t * C.x + t * t * B.x, u * u * A.y + 2 * u * t * C.y + t * t * B.y, u * u * A.z + 2 * u * t * C.z + t * t * B.z);
      aT.push(t); aSeed.push(sd); aOrder.push(order);
    }
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('aT', new THREE.Float32BufferAttribute(aT, 1));
  geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(aSeed, 1));
  geo.setAttribute('aOrder', new THREE.Float32BufferAttribute(aOrder, 1));
  const lineMat = additive(NET_VS, NET_FS, {uTime: {value: 0}, uReveal: {value: 0}, uFade: {value: 0}, uWaveR: {value: -10},
    uC0: {value: new THREE.Color(NEON.green)}, uC1: {value: new THREE.Color(NEON.cyan)}, uC2: {value: new THREE.Color(NEON.pink)}, uC3: {value: new THREE.Color(NEON.yellow)}});
  const lines = noPointer(new THREE.LineSegments(geo, lineMat)); lines.frustumCulled = false;

  const N = 450, dA = new Float32Array(N * 3), dC = new Float32Array(N * 3), dB = new Float32Array(N * 3), dS = new Float32Array(N), dO = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const [A, C, B, , order] = ctrls[Math.floor(r() * ctrls.length)];
    const flip = r() < 0.5;
    (flip ? B : A).toArray(dA, i * 3); C.toArray(dC, i * 3); (flip ? A : B).toArray(dB, i * 3);
    dS[i] = r(); dO[i] = order;
  }
  const dGeo = new THREE.BufferGeometry();
  dGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
  dGeo.setAttribute('aA', new THREE.BufferAttribute(dA, 3)); dGeo.setAttribute('aC', new THREE.BufferAttribute(dC, 3)); dGeo.setAttribute('aB', new THREE.BufferAttribute(dB, 3));
  dGeo.setAttribute('aSeed', new THREE.BufferAttribute(dS, 1)); dGeo.setAttribute('aOrder', new THREE.BufferAttribute(dO, 1));
  const dotMat = additive(NETDOT_VS, DOT_FS, {uTime: {value: 0}, uSize: {value: 0.012}, uFade: {value: 0}, uReveal: {value: 0},
    uColor: {value: new THREE.Color(NEON.cyan)}, uColor2: {value: new THREE.Color(NEON.green)}});
  const dots = noPointer(new THREE.Points(dGeo, dotMat)); dots.frustumCulled = false;

  const ringGeo = new THREE.RingGeometry(0.97, 1, 96).rotateX(-Math.PI / 2);
  const rings = [0, 1, 2].map(() => {
    const m = noPointer(new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: NEON.turquoise, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false})));
    m.position.y = 0.03; return m;
  });
  const group = noPointer(new THREE.Group().add(lines, dots, ...rings));
  return {group, lineMat, dotMat, rings, dots, N};
}

function buildSky() { // cúpula cenital: solo el casquete superior de una esfera
  const alphaCanvas = document.createElement('canvas'); alphaCanvas.width = 4; alphaCanvas.height = 256;
  const g2 = alphaCanvas.getContext('2d'), grad = g2.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#fff'); grad.addColorStop(0.2, '#fff'); grad.addColorStop(0.32, '#000'); grad.addColorStop(1, '#000');
  g2.fillStyle = grad; g2.fillRect(0, 0, 4, 256);
  const mat = new THREE.MeshBasicMaterial({side: THREE.BackSide, transparent: true, opacity: 0, depthWrite: false, fog: false,
    alphaMap: new THREE.CanvasTexture(alphaCanvas), color: 0x000000});
  // thetaLength 1.0 rad ≈ 57° desde el cénit: no baja hasta el horizonte ni el suelo.
  const mesh = noPointer(new THREE.Mesh(new THREE.SphereGeometry(45, 48, 12, 0, Math.PI * 2, 0, 1.0), mat));
  mesh.renderOrder = -1; mesh.visible = false;
  new THREE.TextureLoader().setCrossOrigin('anonymous').load(assetUrl('cielo'),
    (tex) => { tex.colorSpace = THREE.SRGBColorSpace; mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true; mesh.userData.loaded = true; },
    undefined, () => log('no se pudo cargar', ASSETS.cielo.label));
  return {mesh, mat};
}

/* =====================================================================
 * 6. APLICACIÓN: máquina de estados, navegación, interacción
 * ===================================================================== */
class Liquen extends xb.Script {
  init() {
    const r = rng(20251011);
    this.audio = new AudioBus();
    try { this.audio.setup(xb.core.sound.getAudioListener()); } catch (e) { log('audio no disponible', e); }
    const unlock = () => this.audio.unlock();
    document.addEventListener('click', unlock, true);
    document.addEventListener('pointerdown', unlock, true);

    // Luz y atmósfera compartidas
    this.hemi = new THREE.HemisphereLight(0x8fa08a, 0x1b1d14, 1.6);
    this.sun = new THREE.DirectionalLight(0xdfe8d0, 1.1); // única luz direccional, sin sombras

    xb.scene.background = new THREE.Color(0x0d0f0f);

    this.root = noPointer(new THREE.Group()); // decorado: no participa en los rayos
    this.interactive = new THREE.Group();
    this.root.visible = this.interactive.visible = false;
    this.add(this.hemi, this.sun, this.root, this.interactive);

    // Suelo: se dibuja primero y sin escribir profundidad (todo lo demás queda siempre encima).
    this.ground = noPointer(new THREE.Mesh(new THREE.PlaneGeometry(90, 90, 12, 12).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({color: 0x1d2316, depthWrite: false})));
    this.ground.renderOrder = -2;
    // Fondo opaco compartido (mismo color que la niebla): no depende del color de borrado del renderer.
    this.backdrop = noPointer(new THREE.Mesh(new THREE.SphereGeometry(70, 24, 12), new THREE.MeshBasicMaterial({side: THREE.BackSide, fog: false, depthWrite: false})));
    this.backdrop.renderOrder = -3;
    this.forest = buildForest(r);
    this.lichens = buildLichens(r);
    this.sym = buildSymbiosis(r);
    this.rock = buildRock(r);
    this.thallus = buildThallus(r);
    this.thallusRest = new V3(ROCK_POS.x, this.rock.top - 0.01, ROCK_POS.z);
    this.spores = buildSpores(r, this.thallusRest);
    this.fauna = buildFauna(this.forest);
    this.net = buildNetwork(r, this.forest, [this.thallusRest, ...this.fauna.list.map((o) => o.userData.base)]);
    this.sky = buildSky();
    this.root.add(this.backdrop, this.ground, this.forest.group, ...this.lichens.clusters, this.rock.mesh, this.thallus,
      this.spores.pts, this.fauna.group, this.net.group, this.sky.mesh);
    this.interactive.add(...this.lichens.proxies, this.sym.pivot);

    // Velo de transición compartido (navegación manual)
    this.veil = noPointer(new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 8),
      new THREE.MeshBasicMaterial({color: 0x000000, side: THREE.BackSide, transparent: true, opacity: 0, depthTest: false, depthWrite: false, fog: false})));
    this.veil.renderOrder = 9999; this.veil.visible = false;
    this.add(this.veil);
    this.veilState = {a: 0, pending: null, closing: false};

    this.buildUI();
    this.idx = -1; this.t = 0; this.started = false;
    this.rot = {active: false, controller: null, yaw0: 0, pitch0: 0, base: new THREE.Euler(), target: new THREE.Euler(), used: false};
    this.pad = {axis: 0, b: false, cool: 0};
    this.perf = {ema: 1 / 72, slow: 0, low: false};
    this.last = performance.now();
    this.sceneDefs = this.defineScenes();
  }

  buildUI() {
    // Navegación discreta: ◀ número ▶, sigue la vista en la periferia inferior.
    this.navLabel = new xb.UIText({text: '01', style: {fontSize: 22, color: '#9fb1ac', textAlign: 'center', width: 70}});
    const btn = (label, fn) => new xb.UIButton({label, onClick: fn, style: {width: 64, height: 48}});
    this.nav = new xb.UICard({
      size: {width: 0.24, height: 'auto'},
      style: {flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between', padding: 10, gap: 8, borderRadius: 32, backgroundColor: '#0b100e'},

    this.nav.add(new xb.FollowHead({offset: new V3(0, -0.4, -0.85), smoothing: 0.04}), new xb.FaceCamera({mode: 'spherical', smoothing: 0.1}));
    this.nav.visible = false;
    this.add(this.nav);

    // Indicación contextual (solo 02B)
    this.hint = new xb.UICard({
      size: {width: 0.56, height: 'auto'},
      style: {padding: 14, borderRadius: 18, backgroundColor: '#0b100e'},
      children: [new xb.UIText({text: TEXT.hint, style: {fontSize: 20, color: '#c9d6d2', textAlign: 'center'}})],

    this.hint.add(new xb.FaceCamera({mode: 'spherical', smoothing: 0.2}));

    // Línea de tiempo (solo 03), fija en la parte superior de la vista
    this.timeFill = new xb.UIPanel({style: {width: '0%', height: '100%', borderRadius: 3, backgroundColor: '#2de2c8'}});
    const track = new xb.UIPanel({style: {flexGrow: 1, height: 6, borderRadius: 3, backgroundColor: '#3a4442'}, children: [this.timeFill]});
    const label = (text) => new xb.UIText({text, style: {fontSize: 22, color: '#9aa5a2', flexShrink: 0, whiteSpace: 'nowrap'}});
    this.timeline = new xb.UIOverlay({
      appearance: 'none',
      style: {position: 'absolute', top: '34%', left: '50%', transform: {translateX: '-50%'}, width: 720, flexDirection: 'row', alignItems: 'center', gap: 18},
      children: [label(TEXT.timeStart), track, label(TEXT.timeEnd)],
    });
    this.timeline.visible = false;
    this.timeUpd = 0;
    this.add(this.timeline);
  }

  /* ---------- Estados narrativos ---------- */
  defineScenes() {
    const A = this.audio, F = this.forest, L = this.lichens, Y = this.sym, R = this.rock, P = this.spores, N = this.net, K = this.sky;
    const symS2 = {pos: new V3(0, 1.45, -1.25), scale: 1};
    const symS2B = {pos: new V3(0, 1.45, -1.45), scale: 2.2};
    const hongo = (i) => A.tone([196.0, 293.66, 246.94][i % 3], 'steel', 0.16, -0.6);
    const alga = (i) => A.tone([659.25, 493.88, 783.99][i % 3], 'kalimba', 0.14, 0.6);
    const harmony = () => A.arpeggio([261.63, 329.63, 392.0, 493.88, 587.33, 783.99], 'bell', 0.09, 0.09);
    const lichenColors = (neon) => L.clusters.forEach((c) => {
      c.material.uniforms.uColor.value.set(neon ? NEON.green : 0xc6ffd6);
      c.material.uniforms.uColor2.value.set(neon ? NEON.cyan : 0x7fe9d4);
    });
    const resetLichens = (intensity) => L.clusters.forEach((c) => {
      c.position.copy(c.userData.home); c.scale.setScalar(1); c.material.uniforms.uIntensity.value = intensity; c.material.uniforms.uSize.value = 0.012;
    });
    const placeSym = (s) => { Y.pivot.position.copy(s.pos); Y.pivot.scale.setScalar(s.scale); };
    const fauna = (k) => this.fauna.list.forEach((o, i) => o.scale.setScalar(Math.max(0.0001, k[i] ?? k) * o.userData.scale));

    return [
      { // 01 BOSQUE PRESENTE
        mix: {forest: MIX.forest, synth: 0},
        cues: [{at: 26, run: () => { A.playNarr('a01'); A.mix({forest: 0, synth: MIX.synth}, 4); A.arpeggio([523.25, 659.25, 783.99, 1046.5], 'kalimba', 0.1, 0.07); }}],
        enter: () => {
          this.show({forest: 1, lichens: 1, rock: 1}); F.setGrowth(1); R.setReveal(1); lichenColors(false); resetLichens(0);
          this.look = {neon: 0, dark: 0, mineral: 0}; this.selected = 0; this.hovered = -1;
        },
        update: (t, dt) => {
          const reveal = ramp(t, 8, 12), out = smooth(t, 26, 30);
          L.proxies.forEach((p) => { p.visible = t >= 8 && t < 26; });
          L.clusters.forEach((c, i) => {
            const u = c.material.uniforms; const sel = i === this.selected && t >= 26;
            u.uIntensity.value = reveal * (i === this.hovered ? 1.7 : 1) * (sel ? (1 + out * 1.5) * (1 - smooth(t, 28.6, 30)) : 1 - out);
            if (sel) { // acercamiento: el liquen viene hacia el usuario, el bosque se atenúa
              xb.core.camera.getWorldPosition(_v); xb.core.camera.getWorldDirection(_v2);
              _v.addScaledVector(_v2, 0.9); _v.y -= c.userData.cy;
              c.position.lerpVectors(c.userData.home, _v, out * 0.8); c.scale.setScalar(1 + out * 1.4); u.uSize.value = 0.012 * (1 + out);
            }
          });
          this.look.dark = out;
        },
      },
      { // 02 ENCUENTRO
        mix: {forest: 0, synth: MIX.synth},
        cues: [
          {at: 2, run: () => A.playNarr('a02')},
          ...[4, 6.4, 8.8, 11.2, 13.6, 16].flatMap((at, i) => [{at, run: () => hongo(i)}, {at: at + 0.8, run: () => alga(i)}]),
          {at: 20.5, run: harmony}, {at: 26, run: harmony},
        ],
        enter: () => { this.show({sym: 1}); this.look = {neon: 1, dark: 1, mineral: 1}; placeSym(symS2); Y.pivot.rotation.set(0, 0, 0); },
        update: (t) => {
          Y.hMat.uniforms.uFade.value = Y.cellMat.uniforms.uFade.value = smooth(t, 0, 3);
          Y.hMat.uniforms.uGrow.value = lerp(0.05, 0.45, smooth(t, 1, 11)) + 0.25 * smooth(t, 17, 23) + 0.3 * smooth(t, 22, 29);
          const near = smooth(t, 9, 19);
          Y.hyphaeG.position.x = lerp(-0.55, 0, near); Y.cellsG.position.x = lerp(0.55, 0, near);
          Y.cellsG.scale.setScalar(lerp(0.6, 1, smooth(t, 3, 11)));
          Y.cellMat.uniforms.uGlow.value = 1 + 1.2 * smooth(t, 20, 22) * (0.6 + 0.4 * Math.sin(t * 3));
          Y.pivot.rotation.y = 0.12 * smooth(t, 24, 30) * (t - 24);
        },
      },
      { // 02B INTIMIDAD CELULAR
        mix: {forest: 0, synth: MIX.synth},
        cues: [{at: 0.8, run: () => A.playNarr('a03')}],
        enter: () => {
          this.show({sym: 1}); this.look = {neon: 1, dark: 1, mineral: 1};
          Y.hyphaeG.position.x = Y.cellsG.position.x = 0; Y.cellsG.scale.setScalar(1);
          Y.hMat.uniforms.uGrow.value = 1; Y.hMat.uniforms.uFade.value = Y.cellMat.uniforms.uFade.value = 1;
          this.zoomFrom = this.prevIdx === 1 ? {pos: Y.pivot.position.clone(), scale: Y.pivot.scale.x} : {pos: symS2.pos, scale: symS2.scale};
          if (this.prevIdx !== 1) Y.pivot.rotation.set(0, 0, 0);
          this.rot.used = false;
        },
        update: (t, dt) => {
          const z = smooth(t, 0, 3);
          Y.pivot.position.lerpVectors(this.zoomFrom.pos, symS2B.pos, z);
          Y.pivot.scale.setScalar(lerp(this.zoomFrom.scale, symS2B.scale, z));
          Y.cellMat.uniforms.uGlow.value = this.rot.active ? 2.2 : 1.2;
          this.hint.visible = t > 1 && t < 12 && !this.rot.used;
          if (!this.rot.active) Y.pivot.rotation.y += dt * 0.05;
        },
      },
      { // 03 ROCA MADRE Y CRECIMIENTO DEL BOSQUE
        mix: {forest: 0, synth: MIX.synth},
        cues: [
          {at: 0.5, run: () => A.playNarr('a04')},
          {at: 6, run: () => A.arpeggio([392.0, 587.33], 'bell', 0.12, 0.12)},
          {at: 10.3, run: () => A.playNarr('a05')},
          {at: 30, run: () => A.arpeggio([261.63, 329.63, 392.0, 523.25, 659.25], 'kalimba', 0.08, 0.16)},
          {at: 40.2, run: () => A.playNarr('a06')},
        ],
        enter: () => {
          this.show({forest: 1, rock: 1, thallus: 1, spores: 1, fauna: 1, sym: 1, lichens: 1});
          this.symFrom = this.prevIdx === 2 ? {pos: Y.pivot.position.clone(), scale: Y.pivot.scale.x} : {pos: symS2B.pos, scale: symS2B.scale};
          Y.hMat.uniforms.uGrow.value = 1; Y.cellsG.position.x = Y.hyphaeG.position.x = 0;
          F.setGrowth(0); R.setReveal(0); fauna(0); lichenColors(true); resetLichens(0);
          this.look = {neon: 1, dark: 0, mineral: 1}; this.timeline.visible = true;
        },
        update: (t, dt) => {
          // Fase A (0–10): de la escala celular al liquen completo sobre la roca desnuda
          const back = smooth(t, 0, 3);
          Y.pivot.position.lerpVectors(this.symFrom.pos, this.thallusRest, back);
          Y.pivot.scale.setScalar(lerp(this.symFrom.scale, 0.15, back));
          Y.hMat.uniforms.uFade.value = Y.cellMat.uniforms.uFade.value = 1 - back;
          Y.pivot.visible = back < 1;
          const fall = 1 - Math.pow(1 - ramp(t, 0.5, 6), 3);
          this.thallus.position.set(this.thallusRest.x, lerp(2.3, this.thallusRest.y, fall), this.thallusRest.z);
          this.thallus.scale.setScalar(lerp(0.4, 1, fall));
          this.rock.mat.emissiveIntensity = t > 6 ? 0.35 * Math.exp(-(t - 6) * 1.5) : 0;
          R.setReveal(ramp(t, 6, 16));
          // Fase B (10–30): dispersión de esporas
          P.mat.uniforms.uAppear.value = ramp(t, 6, 8) * (1 - ramp(t, 32, 38));
          P.mat.uniforms.uSpread.value = smooth(t, 10, 30);
          // Fase C (30–40): crecimiento del bosque
          const g = ramp(t, 30, 40);
          F.setGrowth(g); this.look.mineral = 1 - g;
          L.clusters.forEach((c) => { c.material.uniforms.uIntensity.value = 0.7 * smooth(t, 38, 42); });
          // Fase D (40–50): fauna
          fauna([smooth(t, 40.5, 42.5), smooth(t, 42.5, 44.5), smooth(t, 44.5, 46.5)]);
          this.animateFauna(t);
          this.setTimeline(t / 50);
        },
        exit: () => { this.timeline.visible = false; Y.pivot.visible = true; },
      },
      { // 04 RED INTERCONECTADA + regreso al origen
        mix: {forest: 0, synth: MIX.synth},
        cues: [
          {at: 1, run: () => A.playNarr('a07')},
          {at: 2, run: () => A.mix({forest: MIX.forest, synth: 0}, 5)},
        ],
        enter: () => {
          this.show({forest: 1, rock: 1, thallus: 1, fauna: 1, net: 1, sky: 1, lichens: 1});
          F.setGrowth(1); R.setReveal(1); fauna(1); lichenColors(true); resetLichens(0.7);
          this.thallus.position.copy(this.thallusRest); this.thallus.scale.setScalar(1);
          this.look = {neon: 1, dark: 0, mineral: 0};
        },
        update: (t) => {
          const back = smooth(t, 30, 37.5);
          N.lineMat.uniforms.uReveal.value = N.dotMat.uniforms.uReveal.value = ramp(t, 0, 12);
          N.lineMat.uniforms.uFade.value = 1 - back;
          N.dotMat.uniforms.uFade.value = ramp(t, 4, 10) * (1 - back);
          const waves = ramp(t, 3, 5) * (1 - back);
          N.rings.forEach((m, i) => {
            const f = ((t * 0.25) + i / 3) % 1; m.scale.setScalar(0.5 + f * 16); m.material.opacity = (1 - f) * 0.45 * waves;
            if (i === 0) N.lineMat.uniforms.uWaveR.value = waves > 0 ? 0.5 + f * 16 : -10;
          });
          K.mat.opacity = K.mesh.userData.loaded ? 0.9 * smooth(t, 2, 12) * (1 - back) : 0;
          // Regreso: el bosque recupera su apariencia orgánica
          this.look.neon = 1 - back;
          fauna(1 - back);
          this.thallus.scale.setScalar(Math.max(0.0001, 1 - back));
          L.clusters.forEach((c) => { c.material.uniforms.uIntensity.value = 0.7 * (1 - back); });
          this.animateFauna(t);
        },
      },
    ];
  }

  show(on) {
    const map = {forest: this.forest.group, rock: this.rock.mesh, thallus: this.thallus, spores: this.spores.pts,
      fauna: this.fauna.group, net: this.net.group, sky: this.sky.mesh, sym: this.sym.pivot};
    for (const [k, obj] of Object.entries(map)) obj.visible = !!on[k];
    this.lichens.clusters.forEach((c) => { c.visible = !!on.lichens; });
    this.lichens.proxies.forEach((p) => { p.visible = false; });
    this.ground.visible = !on.sym || !!on.forest;
    this.rock.mat.emissiveIntensity = 0;
    this.sym.proxy.visible = this.idx === 2;
  }

  applyLook({neon, dark, mineral}) { // paleta orgánica (01) ↔ neón; atenuación y suelo mineral
    _c1.set(0x121812).lerp(_c2.set(0x020806), neon).multiplyScalar(1 - dark);
    this.fog.color.copy(_c1); xb.scene.background.copy(_c1); this.backdrop.material.color.copy(_c1);
    this.fog.density = lerp(0.055, 0.045, neon) + dark * 0.5;
    this.hemi.intensity = lerp(2.0, 0.6, neon) * (1 - dark * 0.85);
    this.sun.intensity = lerp(1.1, 0.35, neon) * (1 - dark);
    const m = this.forest.mats;
    m.trunk.emissive.set(0x3a0f2e).multiplyScalar(neon * 0.45);
    m.cone.emissive.set(0x0b5e3a).multiplyScalar(neon);
    m.round.emissive.set(0x0d6a4a).multiplyScalar(neon);
    m.shrub.emissive.set(0x19803f).multiplyScalar(neon);
    this.ground.material.color.set(0x1d2316).lerp(_c2.set(0x161616), mineral);
    this.ground.material.emissive.set(0x04140c).multiplyScalar(neon * (1 - mineral));
    this.fauna.mat.emissiveIntensity = 0.06 + 0.12 * neon;
  }

  animateFauna(t) {
    const [chucao, beetle, frog] = this.fauna.list;
    chucao.position.y = chucao.userData.base.y + Math.max(0, Math.sin(t * 2.3)) ** 8 * 0.06;
    frog.scale.y = frog.scale.x * (1 + 0.04 * Math.sin(t * 5));
    beetle.position.x = beetle.userData.base.x + Math.sin(t * 0.7) * 0.004;
  }

  setTimeline(x) { // 2/3 de la línea en el primer tercio del tiempo, luego desacelera
    if (performance.now() - this.timeUpd < 100) return;
    this.timeUpd = performance.now();
    const p = x < 1 / 3 ? (x * 3) * (2 / 3) : 2 / 3 + (1 / 3) * (1 - Math.pow(1 - (x - 1 / 3) * 1.5, 3));
    this.timeFill.style.width = `${(clamp01(p) * 100).toFixed(1)}%`;
  }

  /* ---------- Director ---------- */
  start() {
    if (this.started) return;
    this.started = true;
    this.root.visible = this.interactive.visible = this.nav.visible = true;
    this.audio.unlock();
    this.enterScene(0);
  }

  enterScene(i) {
    const prev = this.sceneDefs[this.idx];
    prev?.exit?.();
    this.endRotate();
    this.prevIdx = this.idx; this.idx = i; this.t = 0; this.fired = new Set();
    this.hint.visible = false; this.timeline.visible = false;
    const s = this.sceneDefs[i];
    s.enter();
    this.sym.proxy.visible = i === 2;
    this.navLabel.text = SCENES[i].label;
    this.audio.stopNarr(0.4);
    this.audio.mix(s.mix, 1.5);
  }

  navigate(dir) { // navegación manual: siempre disponible, cancela/acorta transiciones
    if (!this.started) return;
    this.audio.unlock();
    const v = this.veilState;
    const from = v.pending ?? this.idx;
    v.pending = (from + dir + SCENES.length) % SCENES.length;
    v.closing = true;
    this.veil.visible = true;
  }

  updateVeil(dt) {
    const v = this.veilState;
    if (v.closing) {
      v.a = Math.min(1, v.a + dt / 0.3);
      if (v.a >= 1) { this.enterScene(v.pending); v.pending = null; v.closing = false; }
    } else if (v.a > 0) v.a = Math.max(0, v.a - dt / 0.55);
    this.veil.material.opacity = v.a;
    this.veil.visible = v.a > 0;
    if (this.veil.visible) xb.core.camera.getWorldPosition(this.veil.position);
  }

  update(time, frame) {
    const now = performance.now();
    const raw = (now - this.last) / 1000;
    const dt = Math.min(0.1, raw);          // animaciones: paso acotado
    const clock = Math.min(0.5, raw);       // reloj narrativo: sigue el tiempo real (≤180 s aunque caigan cuadros)
    this.last = now;
    if (!this.started) return;
    this.pollGamepads(frame, dt);
    this.updateVeil(dt);
    this.t += clock;
    const s = this.sceneDefs[this.idx];
    for (const [k, c] of s.cues.entries()) if (!this.fired.has(k) && this.t >= c.at) { this.fired.add(k); c.run(); }
    s.update(this.t, dt);
    this.updateRotate(dt);
    this.applyLook(this.look);
    this.tickShared(now / 1000);
    this.audio.tickBed(dt);
    this.watchPerformance(dt);
    if (this.t >= SCENES[this.idx].dur && this.veilState.pending === null) this.enterScene((this.idx + 1) % SCENES.length);
  }

  tickShared(sec) {
    for (const c of this.lichens.clusters) c.material.uniforms.uTime.value = sec;
    this.sym.hMat.uniforms.uTime.value = this.sym.cellMat.uniforms.uTime.value = sec;
    this.spores.mat.uniforms.uTime.value = sec;
    this.net.lineMat.uniforms.uTime.value = this.net.dotMat.uniforms.uTime.value = sec;
    if (this.idx === 0) { // resaltado al apuntar al liquen
      this.hovered = this.lichens.proxies.findIndex((p) => p.visible && xb.user.isPointingAt(p));
    }
  }

  watchPerformance(dt) { // degradación: reduce partículas y sotobosque si cae la tasa de cuadros
    const p = this.perf;
    p.ema = p.ema * 0.95 + dt * 0.05;
    p.slow = p.ema > 1 / 50 ? p.slow + dt : 0;
    if (!p.low && p.slow > 3) {
      p.low = true;
      this.spores.pts.geometry.setDrawRange(0, this.spores.N / 2);
      this.net.dots.geometry.setDrawRange(0, this.net.N / 2);
      this.forest.shrubs.count = Math.floor(this.forest.SHRUBS / 2);
      log('rendimiento bajo: calidad reducida');
    }
  }

  /* ---------- Entrada: selección, rotación y mandos ---------- */
  onSelectStart(event) {
    this.audio.unlock();
    if (!this.started) return;
    const hit = event.surface ?? event.target;
    if (this.rot.active) { this.endRotate(); return; } // segunda activación: suelta el modelo
    if (this.idx === 0) {
      const i = this.lichens.proxies.indexOf(hit);
      if (i >= 0 && this.lichens.proxies[i].visible) {
        this.selected = i;
        if (this.t < 26) this.t = 26; // el acercamiento comienza de inmediato
      }
    } else if (this.idx === 2 && hit === this.sym.proxy && this.t > 1) {
      this.beginRotate(event.source?.controller);
    }
  }

  onKeyDown(event) { // alternativa en el simulador de escritorio
    if (event.code === 'ArrowRight') this.navigate(1);
    else if (event.code === 'ArrowLeft') this.navigate(-1);
    else if (event.code === 'Escape' || event.code === 'KeyB') this.endRotate();
  }

  dirAngles(controller) {
    controller.getWorldQuaternion(_q);
    _v.set(0, 0, -1).applyQuaternion(_q);
    return [Math.atan2(_v.x, -_v.z), Math.asin(THREE.MathUtils.clamp(_v.y, -1, 1))];
  }
  beginRotate(controller) {
    if (!controller) return;
    const [yaw, pitch] = this.dirAngles(controller);
    Object.assign(this.rot, {active: true, controller, yaw0: yaw, pitch0: pitch, used: true});
    this.rot.base.copy(this.sym.pivot.rotation); this.rot.target.copy(this.sym.pivot.rotation);
    this.hint.visible = false;
    this.audio.tone(783.99, 'kalimba', 0.08);
  }
  endRotate() { if (this.rot.active) { this.rot.active = false; this.rot.controller = null; } }
  updateRotate(dt) {
    if (!this.rot.active) return;
    const [yaw, pitch] = this.dirAngles(this.rot.controller);
    let dy = yaw - this.rot.yaw0; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    this.rot.target.y = this.rot.base.y + dy * 2.2;
    this.rot.target.x = THREE.MathUtils.clamp(this.rot.base.x - (pitch - this.rot.pitch0) * 2.2, -1.0, 1.0); // límites estables
    const k = Math.min(1, dt * 8), rot = this.sym.pivot.rotation;
    rot.x += THREE.MathUtils.clamp((this.rot.target.x - rot.x) * k, -0.08, 0.08);
    rot.y += THREE.MathUtils.clamp((this.rot.target.y - rot.y) * k, -0.08, 0.08);
  }

  pollGamepads(frame, dt) { // stick horizontal: navegar · botón B/Y: soltar el modelo
    const sources = frame?.session?.inputSources;
    if (!sources) return;
    this.pad.cool -= dt;
    let axis = 0, b = false;
    for (const src of sources) {
      const gp = src.gamepad;
      if (!gp || src.hand) continue;
      const x = gp.axes[2] ?? 0;
      if (Math.abs(x) > Math.abs(axis)) axis = x;
      if (gp.buttons[5]?.pressed) b = true;
    }
    if (this.pad.cool <= 0 && Math.abs(axis) > 0.8 && Math.abs(this.pad.axis) <= 0.8) { this.navigate(axis > 0 ? 1 : -1); this.pad.cool = 0.4; }
    if (b && !this.pad.b) this.endRotate();
    this.pad.axis = axis; this.pad.b = b;
  }

  onXRSessionStarted() { this.start(); }
  onSimulatorStarted() { this.start(); }
}

/* =====================================================================
 * 7. ARRANQUE
 * ===================================================================== */
const options = new xb.Options();
options.enableVR();                                // inmersivo VR (sin passthrough)
options.sound.speechRecognizer.enabled = false;    // sin reconocimiento de voz
options.permissions.microphone = false;            // nunca se solicita el micrófono
options.setAppTitle(TEXT.title);
options.setAppDescription(TEXT.description);
options.xrButton.startText = TEXT.start;
xb.add(new Liquen());
xb.init(options);
</script>
</body>
